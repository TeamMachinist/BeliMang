apiVersion: v1
kind: ConfigMap
metadata:
  name: belimang-config
  namespace: belimang
data:
  ENV: "development"
  GIN_MODE: "debug"
  HTTP_PORT: "8080"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_USER: "postgres"
  # DB_PASSWORD: moved to Secret
  DB_NAME: "belimang"
  DB_SSLMODE: "disable"
  # DATABASE_URL: moved to Secret
  CACHE_HOST: "redis-service"
  CACHE_PORT: "6379"
  CACHE_PASSWORD: ""
  CACHE_DB: "0"
  REDIS_ADDR: "redis-service:6379"
  LOG_LEVEL: "debug"
  LOG_TYPE: "simple"
  # JWT_SECRET_KEY: moved to Secret
  JWT_ISSUER: "belimang-app"
  GOMAXPROCS: "4"
  GOMEMLIMIT: "1536MiB"
  GODEBUG: "asyncpreemptoff=1"
  GOCACHE: "/tmp/go-cache"
  GOTMPDIR: "/tmp/go-tmp"
