# Default values for belimang
# This is a YAML-formatted file.

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Application configuration
app:
  name: belimang-app
  image:
    registry: docker.io
    repository: arfiansr/belimang-app
    tag: "latest"
    pullPolicy: Always

  replicaCount: 3

  # Environment configuration
  env:
    ENV: production
    GIN_MODE: release
    HTTP_PORT: 8080
    LOG_LEVEL: info
    LOG_TYPE: json
    GOMAXPROCS: 2
    GOMEMLIMIT: 1536MiB
    GODEBUG: asyncpreemptoff=1
    GOCACHE: /tmp/go-cache
    GOTMPDIR: /tmp/go-tmp

  # Resource configuration (optimized for 60k RPS on 7 core, 21GB RAM)
  resources:
    limits:
      cpu: 1500m
      memory: 4Gi
    requests:
      cpu: 1
      memory: 2Gi

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE

  # Health checks
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 40
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Service configuration
service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: belimang.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60

# PostgreSQL configuration (using Bitnami chart)
postgresql:
  enabled: true
  auth:
    postgresPassword: "change-this-secure-password-production"
    username: "postgres"
    password: "change-this-secure-password-production"
    database: "belimang"
    # Enable automatic database creation
    enablePostgresUser: true
    # Create database automatically
    createDatabase: true

  image:
    registry: docker.io
    repository: arfiansr/belimang-postgres
    tag: "latest"

  primary:
    resources:
      limits:
        cpu: 2500m
        memory: 8Gi
      requests:
        cpu: 1500m
        memory: 4Gi

    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""

    # PostgreSQL configuration with io_uring
    configuration: |
      # Performance tuning for production (7 Core, 21GB RAM - shared with app + redis)
      # PostgreSQL gets ~10GB RAM allocation
      shared_buffers = 2GB
      max_connections = 200
      effective_cache_size = 6GB
      maintenance_work_mem = 512MB
      checkpoint_completion_target = 0.9
      wal_buffers = 64MB
      default_statistics_target = 100
      random_page_cost = 1.1
      effective_io_concurrency = 200
      work_mem = 8MB
      min_wal_size = 1GB
      max_wal_size = 4GB
      max_worker_processes = 7
      max_parallel_workers_per_gather = 3
      max_parallel_workers = 7
      max_parallel_maintenance_workers = 3
      # io_uring optimization for PostgreSQL 18
      io_method = io_uring

    # Use ConfigMap for initialization scripts
    initdbScriptsConfigMap: '{{ include "belimang.fullname" . }}-initdb'

# Redis configuration (using Bitnami chart)
redis:
  enabled: true
  auth:
    enabled: false

  image:
    registry: docker.io
    repository: redis
    tag: "7-alpine"
    pullPolicy: Always

  master:
    resources:
      limits:
        cpu: 1
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi

    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""

    # Redis configuration
    configuration: |
      # Memory management
      maxmemory 5gb
      maxmemory-policy allkeys-lru

      # Persistence
      save 900 1
      save 300 10
      save 60 10000

      # Performance
      tcp-keepalive 300
      timeout 0

# Secrets configuration
secrets:
  # Database secrets
  database:
    url: "postgres://postgres:change-this-secure-password-production@belimang-postgresql:5432/belimang?sslmode=disable"
    password: "change-this-secure-password-production"

  # JWT secrets
  jwt:
    secretKey: "change-this-jwt-secret-key-in-production-use-long-random-string-minimum-32-chars"
    issuer: "belimang-app"

# ConfigMap configuration
configMap:
  # Redis connection
  redis:
    addr: "belimang-redis-master:6379"

  # Cache configuration
  cache:
    host: "belimang-redis-master"
    port: 6379
    password: ""
    db: 0

# Development overrides
dev:
  app:
    replicaCount: 1
    image:
      pullPolicy: Never
    resources:
      limits:
        cpu: 1
        memory: 1Gi
      requests:
        cpu: 1
        memory: 256Mi
    env:
      ENV: development
      GIN_MODE: debug
      LOG_LEVEL: debug
      LOG_TYPE: simple
      GOMAXPROCS: 4
      GOMEMLIMIT: 1536MiB

  postgresql:
    primary:
      resources:
        limits:
          cpu: 1
          memory: 1Gi
        requests:
          cpu: 500m
          memory: 256Mi
      persistence:
        size: 2Gi

  redis:
    master:
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 128Mi
      persistence:
        size: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
