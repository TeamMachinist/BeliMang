# monitoring/grafana/provisioning/datasources/prometheus.yml
# Auto-connect Grafana to Prometheus (no manual setup needed!)

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST
    version: 1
